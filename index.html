<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>외국인 유학생 의료 키오스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4FAF9;--paper:#fff;--ink:#1E2D2C;--sub:#6F8583;--pri:#1AA59B;--soft:#E4F6F4;--line:#E3EEED;--btn:#17A096;--btnink:#fff;--yel:#FFD84A;--red:#E5484D;--sh:0 6px 18px rgba(30,110,104,.10);color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,'Malgun Gothic',sans-serif,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji'}
button,input{font-family:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
#stage{position:absolute;left:50%;top:50%;background:var(--paper);border-radius:30px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
#stage.full{border-radius:0;box-shadow:none}
.top{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.logo b{width:34px;height:34px;border-radius:10px;background:var(--pri);display:grid;place-items:center}
.tr{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--sub);font-weight:500}
.pill,.hb{height:42px;border-radius:14px;background:var(--soft);color:var(--ink);display:none;place-items:center;font-weight:700;font-size:15px}
.pill{grid-auto-flow:column;gap:6px;padding:0 12px}.hb{width:42px}
.prog{display:none;gap:6px;padding:0 24px;flex:none}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--pri)}
.scr{display:none;flex:1;min-height:0;flex-direction:column;padding:20px 24px 0;overflow-y:auto;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}.scr.on{display:flex}
h1{font-size:32px;font-weight:900;line-height:1.25;letter-spacing:-.02em}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.chip{width:54px;height:54px;border-radius:18px;background:var(--soft);color:var(--pri);display:grid;place-items:center;flex:none}
.act{display:flex;gap:12px;padding:16px 0 12px;margin-top:auto}
.btn{flex:1;height:74px;border-radius:24px;font-size:23px;font-weight:700;background:var(--btn);color:var(--btnink);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.btn.g{background:var(--soft);color:var(--ink);flex:.62}.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.3}.btn:active:not(:disabled){transform:scale(.97)}
.sf{padding:0 24px 20px;flex:none}
.staff{width:100%;height:52px;border:2px solid var(--line);border-radius:18px;color:var(--sub);font-size:17px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.hero{flex:1;display:grid;place-items:center;min-height:0}.hero svg{width:100%;max-height:100%}
#touch{text-align:center;font-size:40px;transition:opacity .4s;padding-bottom:8px}
.fl{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px)}}
.rp{transform-origin:center;transform-box:fill-box;animation:rp 2s ease-out infinite}.rp2{animation-delay:1s}
@keyframes rp{from{transform:scale(.4);opacity:.9}to{transform:scale(1.5);opacity:0}}
/* home */
.l3{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:0}
.lc{border-radius:26px;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:23px;font-weight:700;transition:transform .12s}
.lc:active{transform:scale(.96);border-color:var(--pri)}
.lc i{font-style:normal;width:76px;height:76px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-size:26px;font-weight:900}
.gd{display:flex;justify-content:space-between;background:var(--soft);border-radius:28px;padding:20px 10px;margin-top:16px}
.gs{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;font-size:16px;font-weight:700;text-align:center}
.gi{width:64px;height:64px;border-radius:21px;background:var(--paper);color:var(--pri);display:grid;place-items:center}
.gd s{color:var(--sub);align-self:center;margin-top:-26px}
/* generic cards */
.gr{display:grid;gap:12px}
.gc{border-radius:24px;background:var(--paper);border:3px solid var(--line);padding:14px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:18px;font-weight:700;text-align:center;box-shadow:var(--sh);min-height:104px;transition:transform .12s}
.gc .em{font-size:42px;line-height:1}.gc.s{border-color:var(--pri);background:var(--soft)}.gc:active{transform:scale(.96)}
.rg{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0}
.rc{flex:1;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:30px;font-weight:900;box-shadow:var(--sh);text-align:center}
.rc small{font-size:15px;font-weight:500;opacity:.8}.rc .ci{width:120px;height:120px;border-radius:38px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.rc.q{background:var(--pri);color:#fff}.rc.m{background:var(--yel);color:#14201F}.rc.m .ci{background:rgba(255,255,255,.55)}
.fld{width:100%;height:62px;border-radius:20px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:21px;font-weight:500;padding:0 20px;margin-bottom:12px;user-select:text;-webkit-user-select:text}
.fld:focus{outline:0;border-color:var(--pri)}
/* symptom */
.seg{display:flex;background:var(--soft);border-radius:20px;padding:5px;margin-bottom:12px}
.seg button{flex:1;height:54px;border-radius:16px;font-size:20px;font-weight:700;color:var(--sub)}.seg button.on{background:var(--btn);color:var(--btnink)}
.bd{flex:1;min-height:0;background:var(--bg);border-radius:30px;display:flex;flex-direction:column;padding:14px}
.bd svg{flex:1;min-height:0;width:100%}
.bp{fill:var(--paper);stroke:var(--pri);stroke-width:3;cursor:pointer;transition:fill .15s}.bp.s{fill:var(--pri)}
.bn{fill:#fff;font-size:20px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}.bg{fill:var(--pri);pointer-events:none}
.chs{display:flex;gap:8px;overflow-x:auto;padding-top:12px;min-height:58px;align-items:center}
.chs em{font-style:normal;color:var(--sub);font-size:17px;margin:0 auto}
.cp{flex:none;height:44px;padding:0 8px 0 14px;border-radius:22px;background:var(--paper);border:2px solid var(--pri);display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.cp b{width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:14px;display:grid;place-items:center}
.fcs{display:flex;justify-content:space-between;margin-bottom:16px}
.fc{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;border:4px solid transparent;opacity:.55;transition:.15s}
.fc.s{border-color:var(--pri);opacity:1;transform:scale(1.12)}
.fc svg{width:64px;height:64px}
/* detective */
.dcs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;color:var(--pri)}
.dch{padding:8px 14px;border-radius:20px;background:var(--soft);font-size:17px;font-weight:700;color:var(--ink)}.dch.f{background:var(--pri);color:#fff}
.qd{display:flex;gap:6px;margin-bottom:14px}.qd i{flex:1;height:6px;border-radius:3px;background:var(--line)}.qd i.on{background:var(--pri)}
#qt{font-size:30px;margin-bottom:22px}
/* summary */
.sx{border-radius:26px;background:var(--bg);padding:14px 16px;margin-bottom:12px}
.sh{display:flex;justify-content:space-between;align-items:center;color:var(--pri);margin-bottom:10px}
.sh button{width:40px;height:40px;border-radius:13px;background:var(--paper);color:var(--ink);display:grid;place-items:center}
.sb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sch{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:16px;padding:8px 12px;font-size:19px}
.sch span{display:flex;flex-direction:column;line-height:1.2}.sch small{font-size:13px;color:var(--sub);font-weight:500}
.bb{margin-left:auto;font-size:14px;font-weight:700;color:var(--pri);background:var(--soft);padding:6px 12px;border-radius:14px}
/* done */
.dn{display:flex;flex-direction:column;align-items:center;gap:16px}
.ok{width:120px;height:120px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.tk{width:100%;border-radius:30px;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);padding:18px;text-align:center}
.tk small{font-size:18px;color:var(--sub);font-weight:500}.tk strong{display:block;font-size:80px;font-weight:900;color:var(--pri);line-height:1.1}
.nd{width:100%;border-radius:26px;background:var(--yel);color:#14201F;padding:14px 20px;display:flex;align-items:center;gap:16px;font-size:26px;font-weight:900}.nd span{font-size:46px}
.nr{width:100%;display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;opacity:0;animation:in .4s forwards}.nr b{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(40,100,96,.28);backdrop-filter:blur(6px);display:none;place-items:center;z-index:5}.ov.on{display:grid}
.pn{width:450px;border-radius:32px;background:var(--paper);padding:32px 26px 26px;display:flex;flex-direction:column;align-items:center;gap:20px;font-size:26px;font-weight:700;text-align:center}
.pn.r{background:var(--red);color:#fff}.pn.r .btn{background:#fff;color:var(--red)}
.lo{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}.lo button{height:70px;border-radius:20px;background:var(--soft);font-size:22px;font-weight:700}
.bl{color:var(--pri);animation:rg 1.2s ease-in-out infinite}.pn.r .bl{color:#fff}@keyframes rg{50%{transform:rotate(14deg)}}
.sp{color:var(--pri);animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.vw{display:grid;place-items:center;flex:1;min-height:0}
.vf{position:relative;width:250px;height:250px;border-radius:24px;background:var(--soft);overflow:hidden;color:var(--pri)}
.vf svg{position:absolute;inset:55px;width:140px;height:140px;opacity:.4}
.vf u{position:absolute;left:24px;right:24px;height:4px;border-radius:2px;background:var(--pri);box-shadow:0 0 14px var(--pri);animation:sc 1.4s ease-in-out infinite alternate}
@keyframes sc{from{top:24px}to{top:222px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.nr{opacity:1}}
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <div class="logo"><b><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></b>CAMPUS CLINIC</div>
    <div class="tr"><span id="clock"></span><button class="pill" id="lp"><span data-i="globe" data-s="20"></span><span class="lt"></span></button><button class="hb" id="hb"></button></div>
  </div>
  <div class="prog" id="prog"><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <section class="scr on" id="s0">
    <div class="hero"><svg viewBox="0 0 440 440" aria-hidden="true">
      <circle cx="220" cy="220" r="205" fill="var(--soft)"/>
      <rect x="120" y="70" width="200" height="290" rx="30" fill="var(--paper)" stroke="var(--ink)" stroke-width="6"/>
      <rect x="140" y="95" width="160" height="190" rx="18" fill="var(--soft)"/>
      <path d="M200 125h40v40h40v40h-40v40h-40v-40h-40v-40h40z" fill="var(--pri)"/>
      <rect x="170" y="310" width="100" height="22" rx="11" fill="var(--yel)"/>
      <circle class="rp" cx="262" cy="320" r="34" fill="none" stroke="var(--pri)" stroke-width="5"/>
      <circle class="rp rp2" cx="262" cy="320" r="34" fill="none" stroke="var(--pri)" stroke-width="5"/>
      <path d="M330 420L270 330" stroke="#F2C29B" stroke-width="40" stroke-linecap="round"/><circle cx="266" cy="322" r="17" fill="#F2C29B"/>
      <g class="fl"><circle cx="70" cy="130" r="40" fill="var(--paper)" stroke="var(--line)" stroke-width="3"/><g transform="translate(46 106)" fill="none" stroke="var(--pri)" stroke-width="2" stroke-linecap="round"><svg width="48" height="48" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.500 3.500 3.500 14.500 0 18M12 3c-3.500 3.500-3.500 14.500 0 18"/></svg></g></g>
      <g class="fl"><circle cx="375" cy="150" r="38" fill="var(--yel)"/><path d="M375 168c-22-14-22-30-10-34 6-2 10 2 10 6 0-4 4-8 10-6 12 4 12 20-10 34z" fill="#14201F"/></g>
      <g class="fl"><circle cx="64" cy="320" r="36" fill="var(--pri)"/><path d="M64 300v40M44 320h40" stroke="#fff" stroke-width="9" stroke-linecap="round"/></g>
    </svg></div>
    <h1 id="touch"></h1>
    <div class="act" style="margin-top:0"><button class="btn"><span data-t="start"></span></button></div>
  </section>

  <section class="scr" id="s1">
    <div class="hd"><div class="chip" data-i="globe" data-s="32"></div><h1 data-t="lang"></h1></div>
    <div class="l3"><button class="lc" data-l="ko"><i>가</i>한국어</button><button class="lc" data-l="en"><i>A</i>English</button><button class="lc" id="lx"><i>…</i><span data-t="other"></span></button></div>
    <div class="gd" id="g1"></div>
    <div class="act"></div>
  </section>

  <section class="scr" id="s2">
    <div class="hd"><div class="chip" data-i="user" data-s="32"></div><h1 data-t="reg"></h1></div>
    <div class="rg">
      <button class="rc q" id="bq"><div class="ci" data-i="qr" data-s="80"></div><span data-t="qr"></span><small>PRE-KIOSK</small></button>
      <button class="rc m" id="bm"><div class="ci" data-i="kb" data-s="80"></div><span data-t="manual"></span></button>
    </div>
    <div class="act"><button class="btn g" data-prev><span data-i="l" data-s="26"></span><span data-t="prev"></span></button></div>
  </section>

  <section class="scr" id="s3">
    <div class="hd"><div class="chip" data-i="qr" data-s="32"></div><h1 data-t="qr"></h1></div>
    <div class="vw"><div class="vf"><span data-i="qr" data-s="140"></span><u></u></div></div>
    <div class="gd" id="g3"></div>
    <div class="act"><button class="btn g" id="sw"><span data-t="swt"></span></button><button class="btn" id="ld0"><span data-i="dl" data-s="26"></span><span data-t="load"></span></button></div>
  </section>

  <section class="scr" id="s4">
    <div class="hd"><div class="chip" data-i="kb" data-s="32"></div><h1 data-t="manual"></h1></div>
    <input class="fld" id="fn" autocomplete="off"><input class="fld" id="fb" inputmode="numeric" autocomplete="off">
    <div class="gr" id="ig" style="grid-template-columns:1fr 1fr"></div>
    <div class="act"><button class="btn g" data-prev><span data-i="l" data-s="26"></span><span data-t="prev"></span></button><button class="btn" id="n4" disabled><span data-t="next"></span><span data-i="r" data-s="26"></span></button></div>
  </section>

  <section class="scr" id="s5">
    <div class="hd"><div class="chip" data-i="check" data-s="32"></div><h1 data-t="cf"></h1></div>
    <div id="cfc"></div>
    <div class="act"><button class="btn g" data-prev><span data-i="l" data-s="26"></span><span data-t="prev"></span></button><button class="btn" id="n5"><span data-t="ok2"></span><span data-i="r" data-s="26"></span></button></div>
  </section>

  <section class="scr" id="s6">
    <div class="hd"><div class="chip" data-i="pulse" data-s="32"></div><h1 data-t="sym"></h1></div>
    <div class="seg"><button data-v="f" class="on" data-t="front"></button><button data-v="b" data-t="back"></button></div>
    <div class="bd"><div id="fig" style="flex:1;min-height:0;display:flex"></div><div class="chs" id="chs"></div></div>
    <div class="act"><button class="btn g" data-prev><span data-i="l" data-s="26"></span><span data-t="prev"></span></button><button class="btn" id="n6" disabled><span data-t="next"></span><span data-i="r" data-s="26"></span></button></div>
  </section>

  <section class="scr" id="s7">
    <div class="hd"><div class="chip" data-i="face" data-s="32"></div><h1 data-t="pain"></h1></div>
    <div class="fcs" id="fcs"></div>
    <div class="gr" id="sg" style="grid-template-columns:repeat(3,1fr)"></div>
    <input class="fld" id="nt" autocomplete="off" style="margin:14px 0 0">
    <div class="act"><button class="btn g" data-prev><span data-i="l" data-s="26"></span><span data-t="prev"></span></button><button class="btn" id="n7" disabled><span data-t="next"></span><span data-i="r" data-s="26"></span></button></div>
  </section>

  <section class="scr" id="s8">
    <div class="hd"><div class="chip" data-i="alert" data-s="32" style="color:var(--red)"></div><h1 data-t="em"></h1></div>
    <div class="gr" id="eg" style="grid-template-columns:1fr 1fr;flex:1;grid-auto-rows:1fr;margin-bottom:6px"></div>
    <div class="act"><button class="btn g" data-prev><span data-i="l" data-s="26"></span><span data-t="prev"></span></button><button class="btn" id="emb" style="flex:1.4"></button></div>
  </section>

  <section class="scr" id="s9">
    <div class="dcs"><span data-i="search" data-s="28"></span><div id="dc" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
    <div class="qd" id="qd"></div>
    <h1 id="qt"></h1>
    <div class="gr" id="qo" style="flex:1;max-height:300px"></div>
    <div class="act"><button class="btn g" data-prev><span data-i="l" data-s="26"></span><span data-t="prev"></span></button><button class="btn g" id="sk" style="flex:1"><span data-t="skip"></span></button></div>
  </section>

  <section class="scr" id="s10">
    <div class="hd"><div class="chip" data-i="list" data-s="32"></div><h1 data-t="sm"></h1><span class="bb" id="bb"></span></div>
    <div id="smc"></div>
    <div class="act"><button class="btn g" data-prev><span data-i="l" data-s="26"></span><span data-t="prev"></span></button><button class="btn" id="n10"><span data-i="check" data-s="28"></span><span data-t="fin"></span></button></div>
  </section>

  <section class="scr" id="s11">
    <div class="dn">
      <div class="ok" data-i="check" data-s="70"></div>
      <h1 data-t="done"></h1>
      <div class="tk"><small data-t="ticket"></small><strong id="num"></strong></div>
      <div class="nd" id="nd"></div>
      <div style="display:flex;flex-direction:column;gap:8px;width:100%"><div class="nr" style="animation-delay:.3s"><b data-i="check" data-s="18"></b><span data-t="n1"></span></div><div class="nr" style="animation-delay:.9s"><b data-i="check" data-s="18"></b><span data-t="n2"></span></div><div class="nr" style="animation-delay:1.5s"><b data-i="check" data-s="18"></b><span data-t="n3"></span></div></div>
    </div>
    <div class="act"><button class="btn" id="hm"></button></div>
  </section>

  <div class="sf"><button class="staff" id="st"><span data-i="bell" data-s="22"></span><span data-t="staff"></span></button></div>

  <div class="ov" id="ld"><div class="pn"><div class="sp" data-i="load" data-s="72"></div><span data-t="loading"></span></div></div>
  <div class="ov" id="call"><div class="pn"><div class="bl" data-i="bell" data-s="90"></div><span data-t="called"></span><button class="btn" data-close style="width:100%;flex:none;height:62px"><span data-t="ok"></span></button></div></div>
  <div class="ov" id="emo"><div class="pn r"><div class="bl" data-i="alert" data-s="90"></div><span data-t="emt"></span><span style="font-size:20px;font-weight:500" data-t="emd"></span><button class="btn" data-close style="width:100%;flex:none;height:62px"><span data-t="ok"></span></button></div></div>
  <div class="ov" id="lo"><div class="pn"><div class="chip" data-i="globe" data-s="34"></div><div class="lo" id="lol"></div><button class="btn g" data-close style="width:100%;flex:none;height:60px"><span data-t="cancel"></span></button></div></div>
</div>

<script>
const P={
